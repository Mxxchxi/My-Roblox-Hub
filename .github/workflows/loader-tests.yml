name: Multi-Game Loader Static Tests

on:
  push:
    branches:
      - feature/universal-multi-game-loader
  pull_request:
    paths:
      - "Loader.lua"
      - "GameRegistry.lua"
      - "Games/**"
      - "tests/**"
      - ".github/workflows/loader-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static contract tests
        run: python -m unittest discover -s tests -v
