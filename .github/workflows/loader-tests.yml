name: Multi-Game Loader Tests

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "Loader.lua"
      - "GameRegistry.lua"
      - "Games/**"
      - "tests/**"
      - ".github/workflows/loader-tests.yml"
  pull_request:
    paths:
      - "Loader.lua"
      - "GameRegistry.lua"
      - "Games/**"
      - "tests/**"
      - ".github/workflows/loader-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static contract tests
        run: python -m unittest discover -s tests -v
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Check egg script syntax and run simulated workflow tests
        run: |
          luac5.4 -p Games/StealAnEgg_Diagnostics.lua
          luac5.4 -p Loader.lua
          lua5.4 tests/test_egg_collect.lua
          lua5.4 tests/test_runtime_smoke.lua
